name: vidya_music
description: A player for the Vidya Intarweb Playlist (aka VIP Aersia)

publish_to: 'none'

version: 2.2.0+20

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  audio_video_progress_bar: ^2.0.3
  bloc: ^9.1.0
  device_info_plus: ^12.2.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  meta: ^1.16.0
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.3
  text_scroll: ^0.2.1
  url_launcher: ^6.3.2
  vs_scrollbar: ^1.0.0
  flutter_localizations:
    sdk: flutter
  intl: any


dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^10.0.0

flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/config.json
    - assets/icon/
